<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Finishing sign-in</title>
<style>
  :root { --green:#0E6B4C; --bg:#EEEFEC; --ink:#16181A; --dim:#5C636B }
  @media (prefers-color-scheme: dark) { :root { --bg:#1E2124; --ink:#F1F2F0; --dim:#A7AEB6 } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
  main { max-width:560px; margin:0 auto; padding:32px 16px }
  .sign { background:var(--green); color:#fff; border-radius:12px; padding:4px }
  .sign > div { border:2px solid #fff; border-radius:8px; padding:18px }
  h1 { margin:0; font-size:26px }
  p { color:var(--dim) }
  a.button { display:inline-block; margin-top:12px; background:var(--green); color:#fff; padding:12px 18px; border-radius:8px; text-decoration:none; font-weight:600 }
</style>
</head>
<body>
<main>
  <div class="sign"><div><h1>Signing in to Kilowatt</h1></div></div>
  <p id="msg">One moment.</p>
  <p><a id="go" class="button" href="#" hidden>Continue</a></p>
</main>
<script>
/*
 * Tesla sends you here after sign-in with a one-time code. This page passes the code on:
 * - to the Kilowatt app (kilowatt://oauth), or
 * - to your home hub, but only if the hub's address is on your own network
 *   (a private IP address, .local, .lan, .home.arpa, localhost or a Tailscale .ts.net name).
 * The code is useless without your app's secret, and it expires within minutes.
 */
(function () {
  var msg = document.getElementById("msg");
  var go = document.getElementById("go");
  function say(text) { msg.textContent = text; }
  function decode(s) {
    try {
      var b64 = s.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      var json = decodeURIComponent(Array.prototype.map.call(atob(b64), function (c) { return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2); }).join(""));
      var t = JSON.parse(json);
      return t && (t.t === "app" || t.t === "hub") && typeof t.n === "string" ? t : null;
    } catch (e) { return null; }
  }
  function privateHost(host) {
    host = host.toLowerCase();
    if (host === "localhost" || /\.(local|lan|home\.arpa|ts\.net)$/.test(host)) return true;
    var m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)$/.exec(host);
    if (!m) return false;
    var a = +m[1], b = +m[2];
    return a === 10 || a === 127 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168) || (a === 100 && b >= 64 && b <= 127);
  }
  var params = new URLSearchParams(location.search);
  var state = decode(params.get("state") || "");
  if (!state || (!params.get("code") && !params.get("error"))) {
    say("This page finishes signing in to the Kilowatt app. Start the sign-in from the app (or the home hub's setup page).");
    return;
  }
  var target;
  if (state.t === "app") {
    target = "kilowatt://oauth" + location.search;
  } else {
    var u;
    try { u = new URL(state.u); } catch (e) { u = null; }
    if (!u || (u.protocol !== "http:" && u.protocol !== "https:") || !privateHost(u.hostname) || !/\/oauth\/callback\/?$/.test(u.pathname)) {
      say("This sign-in points somewhere that isn't a Kilowatt hub on your home network, so it was stopped. Start again from the hub's setup page.");
      return;
    }
    u.search = location.search;
    target = u.toString();
  }
  go.href = target;
  go.hidden = false;
  say(state.t === "app" ? "Opening Kilowatt. If nothing happens, tap Continue." : "Taking you back to your home hub. If nothing happens, tap Continue.");
  location.replace(target);
})();
</script>
</body>
</html>
